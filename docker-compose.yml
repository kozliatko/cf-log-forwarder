# ============================================================
# Cloudflare syslog poller
#   start:       docker compose up -d
#   logs:        docker compose logs -f cf-poller
#   one-shot:    docker compose run --rm cf-poller --dry-run
#
# Configuration is read from the .env file (env_file below).
# Docker Compose injects .env entries directly as environment
# variables, which take priority over .env parsing in the script.
# ============================================================
services:
  cf-poller:
    build: .
    image: cf-poller:latest
    container_name: cf-poller
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # state persists in a named volume (inherits ownership from the
      # image, where /data is chowned to the container user)
      STATE_FILE: /data/cf_poller_state.json
      # override as needed (e.g. syslog on the host):
      # SYSLOG_HOST: 192.168.1.10
    volumes:
      - cf-poller-data:/data
    # runtime hardening: poller is an outbound-only client, it does not
    # need privileges, a writable root filesystem or /tmp persistence
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cf-poller-data:
